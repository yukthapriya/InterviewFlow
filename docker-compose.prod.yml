version: '3.8'

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interviewflow}
      POSTGRES_USER: ${POSTGRES_USER:-interviewflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PISTON_URL: ${PISTON_URL:-}
      PISTON_KEY: ${PISTON_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "4000:4000"        # optional: for direct backend access
    restart: always

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_URL: http://backend:4000
    restart: always

volumes:
  db_data: